<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradPelvis" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a0d2e"/>
      <stop offset="60%" stop-color="#140517"/>
      <stop offset="100%" stop-color="#070108"/>
    </radialGradient>
    <linearGradient id="pelvisBoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#d4c7b5"/>
      <stop offset="100%" stop-color="#8c7e6c"/>
    </linearGradient>
    <linearGradient id="uterusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e056fd"/>
      <stop offset="50%" stop-color="#be2edd"/>
      <stop offset="100%" stop-color="#680b7c"/>
    </linearGradient>
    <linearGradient id="bladderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0932b"/>
      <stop offset="100%" stop-color="#ffbe76"/>
    </linearGradient>
    <filter id="neonGlowPelvis" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGradPelvis)"/>

  <!-- Optical Grid & Coordinates -->
  <g opacity="0.1" stroke="#e056fd" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="500" y1="0" x2="500" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="700" y1="0" x2="700" y2="480"/>
  </g>

  <!-- 3D Sagittal Pelvic Silhouette -->
  <g transform="translate(200, 40)">
    <!-- Sacrum and Coccyx (Posterior) -->
    <path d="M 120 60 C 135 120, 140 220, 100 300 L 85 290 C 120 220, 115 120, 100 60 Z" 
          fill="url(#pelvisBoneGrad)" stroke="#d4c7b5" stroke-width="2"/>

    <!-- Pubic Symphysis (Anterior) -->
    <path d="M 320 280 C 330 290, 335 320, 315 330 C 300 330, 295 300, 305 285 Z" 
          fill="url(#pelvisBoneGrad)" stroke="#d4c7b5" stroke-width="2"/>

    <!-- Urinary Bladder (Anterior to Uterus) -->
    <path d="M 280 250 C 310 250, 315 290, 285 300 C 265 305, 255 280, 265 260 Z" 
          fill="url(#bladderGrad)" opacity="0.75" stroke="#f0932b" stroke-width="2"/>

    <!-- Uterus in Anteflexion / Anteversion -->
    <path d="M 200 190 C 230 160, 280 180, 270 230 C 260 270, 220 280, 205 310 L 195 310 C 190 270, 220 240, 220 210 C 220 190, 190 190, 200 190 Z" 
          fill="url(#uterusGrad)" stroke="#e056fd" stroke-width="4" filter="url(#neonGlowPelvis)"/>

    <!-- Uterine Cavity & Cervical Canal -->
    <path d="M 225 200 Q 240 225, 225 265 T 205 310" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

    <!-- Vaginal Canal -->
    <path d="M 205 310 L 220 380 L 205 385 L 195 310 Z" fill="rgba(224, 86, 253, 0.4)" stroke="#e056fd" stroke-width="2"/>

    <!-- Rectum (Posterior) -->
    <path d="M 140 160 C 160 220, 160 310, 140 370 L 125 365 C 145 310, 145 220, 125 160 Z" 
          fill="rgba(186, 70, 90, 0.5)" stroke="#e84118" stroke-width="2"/>

    <!-- Rectouterine Pouch of Douglas -->
    <path d="M 180 270 Q 185 290, 195 310" fill="none" stroke="#2ed5ca" stroke-width="2.5" stroke-dasharray="4,4"/>

    <!-- 3D Interactive Pin Markers -->
    <g transform="translate(245, 195)" filter="drop-shadow(0 0 8px #e056fd)">
      <circle cx="0" cy="0" r="10" fill="#e056fd" opacity="0.85"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      <line x1="0" y1="0" x2="70" y2="-25" stroke="#e056fd" stroke-width="1.5"/>
      <rect x="70" y="-40" width="105" height="22" rx="6" fill="rgba(10,24,30,0.85)" stroke="#e056fd" stroke-width="1"/>
      <text x="78" y="-25" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="700">1. Fundo do Útero</text>
    </g>

    <g transform="translate(185, 280)" filter="drop-shadow(0 0 8px #2ed5ca)">
      <circle cx="0" cy="0" r="10" fill="#2ed5ca" opacity="0.85"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      <line x1="0" y1="0" x2="-60" y2="-20" stroke="#2ed5ca" stroke-width="1.5"/>
      <rect x="-190" y="-35" width="130" height="22" rx="6" fill="rgba(10,24,30,0.85)" stroke="#2ed5ca" stroke-width="1"/>
      <text x="-182" y="-20" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="700">2. Fundo de Saco Douglas</text>
    </g>
  </g>

  <!-- High-Tech Badge Overlay -->
  <rect x="30" y="30" width="190" height="32" rx="8" fill="rgba(224, 86, 253, 0.15)" stroke="rgba(224, 86, 253, 0.4)"/>
  <text x="45" y="51" fill="#e056fd" font-size="12" font-family="sans-serif" font-weight="800" letter-spacing="1">3D ANATOMIA PÉLVICA</text>
  <text x="30" y="445" fill="rgba(255,255,255,0.7)" font-size="14" font-family="sans-serif" font-weight="600">Corte Sagital do Sistema Reprodutor Feminino 3D</text>
</svg>
