<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradHeart" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#351012"/>
      <stop offset="60%" stop-color="#180608"/>
      <stop offset="100%" stop-color="#080203"/>
    </radialGradient>
    <linearGradient id="myoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="50%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#560000"/>
    </linearGradient>
    <linearGradient id="aortaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7979"/>
      <stop offset="50%" stop-color="#eb3b5a"/>
      <stop offset="100%" stop-color="#9a0000"/>
    </linearGradient>
    <linearGradient id="pulmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45aaf2"/>
      <stop offset="100%" stop-color="#2d98da"/>
    </linearGradient>
    <filter id="neonGlowHeart" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGradHeart)"/>

  <!-- Optical Grid & ECG Wave Background -->
  <g opacity="0.1" stroke="#ff4b4b" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="500" y1="0" x2="500" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="700" y1="0" x2="700" y2="480"/>
    <path d="M 0 240 L 250 240 L 270 210 L 285 290 L 305 130 L 325 310 L 340 240 L 400 240 L 430 215 L 460 240 L 800 240" fill="none" stroke="#ff4b4b" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- 3D Realistic Heart Specimen Silhouette -->
  <g transform="translate(230, 40)">
    <!-- Superior Vena Cava -->
    <path d="M 120 40 L 160 40 L 150 140 L 120 140 Z" fill="url(#pulmGrad)" stroke="#45aaf2" stroke-width="2"/>

    <!-- Aortic Arch & Major Branches -->
    <path d="M 160 120 C 160 40, 260 20, 270 120 L 230 140 C 230 70, 190 70, 180 140 Z" fill="url(#aortaGrad)" stroke="#ff7979" stroke-width="3" filter="drop-shadow(0 0 10px rgba(255,121,121,0.4))"/>
    <rect x="190" y="20" width="12" height="30" rx="3" fill="#ff7979"/>
    <rect x="215" y="15" width="12" height="35" rx="3" fill="#ff7979"/>
    <rect x="240" y="22" width="12" height="28" rx="3" fill="#ff7979"/>

    <!-- Pulmonary Trunk -->
    <path d="M 170 110 C 210 110, 240 140, 230 180 L 190 180 Z" fill="url(#pulmGrad)" stroke="#2d98da" stroke-width="2"/>

    <!-- Ventricular Myocardium Volume (3D Morgue Specimen) -->
    <path d="M 130 150 C 70 190, 70 270, 120 330 C 160 370, 210 400, 240 400 C 280 370, 350 280, 330 200 C 310 150, 250 140, 200 150 Z" 
          fill="url(#myoGrad)" stroke="#ff4b4b" stroke-width="4" filter="url(#neonGlowHeart)"/>

    <!-- Coronary Arteries (LAD / Descendente Anterior & Circumflex) -->
    <path d="M 200 160 Q 215 230, 205 290 T 225 370" fill="none" stroke="#ffd32a" stroke-width="3" filter="drop-shadow(0 0 6px #ffd32a)"/>
    <path d="M 210 230 Q 250 260, 270 290" fill="none" stroke="#ffd32a" stroke-width="2"/>
    <path d="M 205 290 Q 170 320, 160 350" fill="none" stroke="#ffd32a" stroke-width="2"/>

    <!-- 3D Interactive Pin Markers -->
    <g transform="translate(205, 250)" filter="drop-shadow(0 0 8px #ffd32a)">
      <circle cx="0" cy="0" r="10" fill="#ffd32a" opacity="0.85"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      <line x1="0" y1="0" x2="80" y2="-20" stroke="#ffd32a" stroke-width="1.5"/>
      <rect x="80" y="-35" width="130" height="22" rx="6" fill="rgba(10,24,30,0.85)" stroke="#ffd32a" stroke-width="1"/>
      <text x="88" y="-20" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="700">1. A. Descendente Anterior</text>
    </g>

    <g transform="translate(215, 60)" filter="drop-shadow(0 0 8px #ff4b4b)">
      <circle cx="0" cy="0" r="10" fill="#ff4b4b" opacity="0.85"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      <line x1="0" y1="0" x2="-70" y2="-20" stroke="#ff4b4b" stroke-width="1.5"/>
      <rect x="-180" y="-35" width="105" height="22" rx="6" fill="rgba(10,24,30,0.85)" stroke="#ff4b4b" stroke-width="1"/>
      <text x="-172" y="-20" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="700">2. Arco Aórtico</text>
    </g>
  </g>

  <!-- High-Tech Badge Overlay -->
  <rect x="30" y="30" width="190" height="32" rx="8" fill="rgba(255, 75, 75, 0.15)" stroke="rgba(255, 75, 75, 0.4)"/>
  <text x="45" y="51" fill="#ff4b4b" font-size="12" font-family="sans-serif" font-weight="800" letter-spacing="1">3D CARDIOVASCULAR</text>
  <text x="30" y="445" fill="rgba(255,255,255,0.7)" font-size="14" font-family="sans-serif" font-weight="600">Coração Humano — Peça Real Edição Morgue 3D</text>
</svg>
