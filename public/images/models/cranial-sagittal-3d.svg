<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradSkull" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e2a35"/>
      <stop offset="60%" stop-color="#06131a"/>
      <stop offset="100%" stop-color="#02080c"/>
    </radialGradient>
    <linearGradient id="cortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="50%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#d4c7b5"/>
      <stop offset="100%" stop-color="#8c7e6c"/>
    </linearGradient>
    <filter id="neonGlowSkull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGradSkull)"/>
  
  <!-- Optical Grid & Coordinates -->
  <g opacity="0.12" stroke="#2ed5ca" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="500" y1="0" x2="500" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="700" y1="0" x2="700" y2="480"/>
    <line x1="0" y1="80" x2="800" y2="800"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- 3D Neuroanatomy & Cranial Vault Silhouette -->
  <g transform="translate(180, 40)">
    <!-- Calvaria Outer Bone Frame -->
    <path d="M 220 30 C 330 30, 390 120, 380 230 C 375 280, 320 340, 240 350 C 200 355, 170 340, 150 310 C 130 280, 110 270, 70 270 C 40 270, 25 240, 40 200 C 50 170, 80 150, 90 120 C 110 60, 160 30, 220 30 Z" 
          fill="none" stroke="url(#boneGrad)" stroke-width="7" filter="drop-shadow(0 0 12px rgba(253,251,247,0.3))"/>

    <!-- Brain Telencephalon Gyri and Sulci (Neon Hologram) -->
    <path d="M 200 70 C 270 65, 330 110, 325 180 C 320 220, 280 250, 220 250 C 170 250, 140 210, 145 170 C 150 120, 160 75, 200 70 Z" 
          fill="rgba(46, 213, 202, 0.15)" stroke="url(#cortexGrad)" stroke-width="4" filter="url(#neonGlowSkull)"/>
    
    <!-- Corpus Callosum & Ventricles -->
    <path d="M 190 140 C 230 130, 270 145, 275 170 C 260 175, 220 160, 185 165 Z" fill="#00d2ff" opacity="0.8"/>
    
    <!-- Cerebellum -->
    <path d="M 280 240 C 320 245, 335 280, 315 310 C 290 325, 265 300, 270 260 Z" 
          fill="rgba(56, 239, 125, 0.2)" stroke="#38ef7d" stroke-width="3"/>
          
    <!-- Brainstem (Pons & Medulla) -->
    <path d="M 230 240 L 235 340 L 210 340 L 215 240 Z" fill="rgba(0, 210, 255, 0.3)" stroke="#00d2ff" stroke-width="2"/>

    <!-- 3D Interactive Pin Markers -->
    <g transform="translate(240, 110)" filter="drop-shadow(0 0 8px #38ef7d)">
      <circle cx="0" cy="0" r="10" fill="#38ef7d" opacity="0.8"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      <line x1="0" y1="0" x2="60" y2="-30" stroke="#38ef7d" stroke-width="1.5"/>
      <rect x="60" y="-45" width="100" height="22" rx="6" fill="rgba(10,24,30,0.85)" stroke="#38ef7d" stroke-width="1"/>
      <text x="68" y="-30" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="700">1. Córtex Parietal</text>
    </g>

    <g transform="translate(300, 275)" filter="drop-shadow(0 0 8px #00d2ff)">
      <circle cx="0" cy="0" r="10" fill="#00d2ff" opacity="0.8"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      <line x1="0" y1="0" x2="60" y2="25" stroke="#00d2ff" stroke-width="1.5"/>
      <rect x="60" y="15" width="90" height="22" rx="6" fill="rgba(10,24,30,0.85)" stroke="#00d2ff" stroke-width="1"/>
      <text x="68" y="30" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="700">2. Cerebelo</text>
    </g>
  </g>

  <!-- High-Tech Badge Overlay -->
  <rect x="30" y="30" width="170" height="32" rx="8" fill="rgba(46, 213, 202, 0.15)" stroke="rgba(46, 213, 202, 0.4)"/>
  <text x="45" y="51" fill="#38ef7d" font-size="12" font-family="sans-serif" font-weight="800" letter-spacing="1">3D NEUROANATOMIA</text>
  <text x="30" y="445" fill="rgba(255,255,255,0.7)" font-size="14" font-family="sans-serif" font-weight="600">Corte Sagital do Crânio Humano Superficial</text>
</svg>
