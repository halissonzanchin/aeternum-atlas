name: Aeternum 26 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:contracts
      - run: npm run test:a26-glass
      - run: npm run test:p0
      - run: npm run build

  edge-function-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/ai-tutor/deno.json supabase/functions/ai-tutor/index.ts

