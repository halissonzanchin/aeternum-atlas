name: Aeternum 26 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:contracts
      - run: npm run test:admin-integrity
      - run: npm run test:transactional-capacity
      - run: npm run test:e7-1-journey
      - run: npm run test:a26-glass
      - run: npm run test:p0
      - run: npm run build

  edge-function-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/ai-tutor/deno.json supabase/functions/ai-tutor/index.ts

  responsive-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://hyivyrietgjdazgizafp.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.dummyKeyForClientInit
      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Run Responsive Regression Suite (Chromium - Closed State)
        run: npm run test:responsive
        env:
          TEST_BETA_STATE: closed
          ARTIFACT_DIR: ./test-artifacts/chromium-closed
      - name: Run Responsive Regression Suite (Chromium - Open State)
        run: npm run test:responsive
        env:
          TEST_BETA_STATE: open
          ARTIFACT_DIR: ./test-artifacts/chromium-open
      - name: Run Responsive Regression Suite (WebKit - Closed State)
        run: npm run test:webkit
        env:
          TEST_BETA_STATE: closed
          ARTIFACT_DIR: ./test-artifacts/webkit-closed
      - name: Run Responsive Regression Suite (WebKit - Open State)
        run: npm run test:webkit
        env:
          TEST_BETA_STATE: open
          ARTIFACT_DIR: ./test-artifacts/webkit-open
      - name: Verify Simulated Responsive Regressions (12 Failure Classes)
        run: npm run test:responsive:simulated
      - name: Run Administrative Control Center Multi-Viewport Suite (Playwright)
        run: npm run test:admin-control-center
        env:
          ARTIFACT_DIR: ./test-artifacts/admin-control-center
      - name: Upload Responsive Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-regression-artifacts-${{ github.sha }}
          path: ./test-artifacts/
          if-no-files-found: warn
