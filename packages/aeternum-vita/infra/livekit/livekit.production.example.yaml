port: 7880
bind_addresses:
  - 0.0.0.0

redis:
  address: redis:6379

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

turn:
  enabled: true
  domain: turn.voice.example.com
  udp_port: 3478
  tls_port: 5349
  cert_file: /etc/livekit/certs/fullchain.pem
  key_file: /etc/livekit/certs/privkey.pem

# Injete as chaves por secret/environment em produção. Não grave valores reais aqui.
keys:
  replace-with-key: replace-with-secret
