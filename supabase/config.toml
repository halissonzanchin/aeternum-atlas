
[functions.ai-tutor]
enabled = true
# O gateway não recebe Authorization no preflight CORS do navegador. O handler
# responde OPTIONS e exige o JWT do usuário com auth.getUser() em todo POST.
verify_jwt = false
import_map = "./functions/ai-tutor/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ai-tutor/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ai-tutor/*.html" ]

[functions.voice-token]
enabled = true
# O handler responde ao preflight e valida o JWT Supabase em todo POST.
verify_jwt = false
entrypoint = "./functions/voice-token/index.ts"
